<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipbook Video: Perjalanan Makanan di Dalam Tubuh</title>
<style>
:root{--bg:#fff3dc;--card:#fffdf8;--ink:#2d2a26;--mut:#6b645b;--line:#eadfce;--sky:#d9f1ff;--body:#ffe3c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#2a2622;--ink:#f4ede4;--mut:#b9ad9f;--line:#443d36;--sky:#24475c;--body:#8a6a4f}}
:root[data-theme="dark"]{--bg:#1d1a17;--card:#2a2622;--ink:#f4ede4;--mut:#b9ad9f;--line:#443d36;--sky:#24475c;--body:#8a6a4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
.book{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:1.15rem;margin:4px 0 10px;text-align:center}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chips button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;color:#fff;font-weight:700;cursor:pointer}
.chips button.cur{border-color:var(--ink)}
.page{background:var(--card);border-radius:20px;box-shadow:0 6px 22px rgba(0,0,0,.14);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;transform-origin:left center}
.flip{animation:flip .55s ease}
@keyframes flip{from{transform:perspective(1200px) rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
@media(max-width:700px){.page{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--sky);border-radius:16px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:78vh}
.panel{display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;color:#fff;padding:2px 12px;border-radius:99px;font-size:.85rem;font-weight:700}
h2{margin:0;font-size:1.7rem}
.fn{margin:0;color:var(--mut)}
.cap{min-height:4.6em;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:1.05rem}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c,#ff7a45)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row button,.nav button{border:0;border-radius:12px;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer;background:#ff7a45;color:#fff}
.row button.s{background:var(--line);color:var(--ink)}
.row span{color:var(--mut);font-size:.9rem}
.q{background:#fff3b0;color:#3b3200;border-radius:14px;padding:10px 12px}
.nav{display:flex;justify-content:space-between;margin-top:10px}
.nav button:disabled{opacity:.35}
.wide{grid-column:1/-1;text-align:center;padding:18px 6px}
.wide h2{font-size:1.6rem}.wide ol{text-align:left;max-width:560px;margin:10px auto}
svg *{animation-play-state:paused}.playing *{animation-play-state:running}
.chew{animation:chew .8s infinite alternate}@keyframes chew{to{transform:translateY(-14px)}}
.crumb{animation:cr 5s infinite}@keyframes cr{50%{transform:scale(.5)}}
.drop{animation:dr 1.2s infinite}@keyframes dr{to{transform:translateY(24px);opacity:0}}
.bol{animation:bo 2.5s infinite}@keyframes bo{from{transform:translateY(-40px) scaleX(1)}50%{transform:translateY(0) scaleX(.7)}to{transform:translateY(40px) scaleX(1)}}
.churn{animation:ch 1s infinite alternate;transform-origin:center}@keyframes ch{to{transform:scale(1.15,.8)}}
.bub{animation:bb 2s infinite}@keyframes bb{from{transform:translateY(24px)}to{transform:translateY(-26px);opacity:0}}
.nut{animation:nu 2s infinite}@keyframes nu{to{transform:translateY(26px);opacity:0}}
.wat{animation:wa 2.5s infinite}@keyframes wa{to{transform:translate(26px,-12px);opacity:0}}
.mass{animation:ma 10s infinite alternate;transform-origin:center}@keyframes ma{to{transform:scale(.6)}}
.out{animation:ou 8s infinite}@keyframes ou{70%{transform:translateY(0)}to{transform:translateY(46px)}}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer}.op.ok{background:#c9f2d0;border-color:#2e9e49;color:#123}.op.no{background:#ffd3d3;border-color:#d33;color:#300}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:5px solid #fff;background:rgba(255,122,69,.92);color:#fff;font-size:2.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:2}
.glow{animation:gl 1s infinite alternate}@keyframes gl{to{opacity:.95}}
</style></head><body>

let i=0,t=0,pl=false,last=0,snd=false,ph=-1,done=[],auto=false;

function go(n,k){if(!k)auto=false;i=Math.max(0,Math.min(8,n));t=0;pl=false;ph=-1;try{speechSynthesis.cancel()}catch(e){}render()}

function rs(){t=0;ph=-1;pl=true;last=performance.now();requestAnimationFrame(tick);upd()}
function tick(n){if(!pl)return;t+=(n-last)/1000;last=n;if(t>=D){t=D;pl=false;done[i]=1;if(auto&&i<6){go(i+1,1);tog();return}}upd();if(pl)requestAnimationFrame(tick)}
function at(p,u){let L=[],s=0;for(let k=1;k<p.length;k++){const l=Math.hypot(p[k][0]-p[k-1][0],p[k][1]-p[k-1][1]);L.push(l);s+=l}let d=u*s;for(let k=0;k<L.length;k++){if(d<=L[k]||k==L.length-1){const r=Math.min(1,d/L[k]);return[p[k][0]+(p[k+1][0]-p[k][0])*r,p[k][1]+(p[k+1][1]-p[k][1])*r]}d-=L[k]}}

<div class="q" id="q" hidden><b>Ayo berpikir kritis!</b><br>${o.q}</div></div></div>`;
upd()}
function upd(){
if(i<1||i>6)return;const o=O[i-1],u=t/D,p=at(o.p,u);

}
